<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>InnovaTech Lab 2.0 · UABC</title><meta name="theme-color" content="#07583f"/><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#14342e;background:#f2f6f4}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#087958}.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}.sidebar{background:#063d30;color:#fff;padding:27px 16px;display:flex;flex-direction:column;gap:22px}.brand{padding:0 12px}.brand .tag{font-size:10px;letter-spacing:2px;color:#9ad2b6;font-weight:800}.brand h2{font-size:25px;margin:8px 0 2px;letter-spacing:-1px}.brand small{color:#b6d5c9}.nav{display:grid;gap:6px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#c4ddd3;border-radius:12px;padding:13px 12px;display:flex;gap:10px;align-items:center}.nav button.active{background:#137052;color:#fff;font-weight:700}.sidebarFoot{margin-top:auto;padding:14px 12px;background:#11513f;border-radius:14px;font-size:12px;color:#d2e9df;line-height:1.6}.main{padding:30px 4vw 65px;max-width:1450px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.eyebrow{font-size:12px;color:#158461;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.top h1{font-size:clamp(24px,3vw,35px);margin:6px 0 6px;letter-spacing:-1.2px}.muted{color:#668078;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #c8dcd2;background:white;color:#195743;padding:11px 15px;border-radius:11px;font-weight:700;font-size:13px}.btn.primary{background:#08754e;color:white;border-color:#08754e}.btn:hover{filter:brightness(.96)}.hero{background:linear-gradient(110deg,#07553e,#13855d 70%,#25a878);color:white;border-radius:22px;padding:29px 31px;display:grid;grid-template-columns:1fr 200px;align-items:center;gap:20px;overflow:hidden}.hero h2{font-size:28px;letter-spacing:-.7px;margin:8px 0}.hero p{color:#d7f2e6;max-width:600px;line-height:1.65}.orb{height:155px;width:155px;border-radius:50%;border:24px solid #ffffff25;box-shadow:0 0 0 22px #ffffff13,0 0 0 44px #ffffff09;justify-self:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat,.panel{background:white;border:1px solid #e0eae5;border-radius:17px;padding:20px}.stat strong{display:block;font-size:28px;color:#075d42;margin-top:8px}.stat span{font-size:12px;color:#637e73}.panel h3{margin:0 0 7px;font-size:19px}.panel p{line-height:1.6}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section{display:grid;gap:18px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#36594e}.field input,.field select,.field textarea{border:1px solid #d1dfd8;background:#fcfefd;border-radius:10px;padding:11px 12px;width:100%;outline-color:#0e8a61;color:#173f31}.field textarea{min-height:85px;resize:vertical}.pill{display:inline-block;border-radius:99px;background:#e7f5ee;color:#08754e;padding:6px 11px;font-size:12px;font-weight:800}.progress{height:9px;background:#e1ebe6;border-radius:99px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#0e9165;transition:width .3s}.techs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tech{border:1px solid #d8e7df;border-radius:14px;background:#fff;padding:17px;text-align:left;min-height:100px}.tech.selected{border:2px solid #0c865c;background:#eaf8f0}.tech strong{display:block;margin-bottom:7px}.tech small{color:#688174}.source{border:1px solid #deebe3;border-radius:13px;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.source strong{display:block}.source small{color:#688174}.steps{display:grid;gap:10px}.step{border:1px solid #deebe4;border-radius:12px;padding:12px;background:#fbfdfb;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}.step input{border:0;background:transparent;width:100%;outline-color:#0d885c}.step button{border:0;background:#fbecec;color:#a12b2b;border-radius:8px;padding:7px}.diagram{overflow:auto;background:#f8fbf9;border:1px dashed #c8dcd1;border-radius:14px;padding:15px;text-align:center}.diagram svg{max-width:100%;height:auto}.report{background:white;padding:30px;border:1px solid #dce9e0;border-radius:16px}.report h2{color:#07583f}.report h3{border-bottom:1px solid #d8e9dd;padding-bottom:7px;margin-top:25px}.report p{white-space:pre-wrap;line-height:1.65}.report table{border-collapse:collapse;width:100%;font-size:13px}.report th,.report td{border:1px solid #d7e4dc;padding:9px;text-align:left;vertical-align:top}.report th{background:#eef7f1}.empty{color:#9aada4;font-style:italic}.notice{background:#fff9e7;border:1px solid #f2dca1;border-radius:12px;padding:13px;color:#765a18;font-size:13px}.footer{font-size:12px;color:#71887d;margin-top:25px}.hideprint{}@media(max-width:1000px){.shell{grid-template-columns:1fr}.sidebar{padding:14px}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;width:auto}.sidebarFoot{display:none}.main{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid2,.formgrid,.techs{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.orb{display:none}.top{display:block}.actions{margin-top:14px}.stats{grid-template-columns:repeat(2,1fr)}.field.wide{grid-column:auto}}@media print{@page{size:A4;margin:15mm}body{background:white}.sidebar,.top,.hideprint,.stats,.hero,.footer{display:none!important}.shell{display:block}.main{padding:0;max-width:none}.report{border:0;padding:0}.report h2{font-size:20pt}.report h3{break-after:avoid}.report table,.report svg{break-inside:avoid}.section{display:block}.reportOnly{display:block!important}}
.flowToolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.flowCanvas{height:470px;width:100%;border:1px solid #c6ded2;border-radius:16px;overflow:hidden;background:#fbfefc}.flowCanvas .react-flow__node{cursor:grab}.flowCanvas .react-flow__handle{width:10px;height:10px;background:#087958}@media print{.flowCanvas,.flowToolbar{display:none!important}}
</style></head><body><div id="root"></div><script type="module">
import React,{useState,useEffect} from 'https://esm.sh/react@19.1.0';import{createRoot}from'https://esm.sh/react-dom@19.1.0/client';import htm from'https://esm.sh/htm@3.1.1';import ReactFlow,{Background,Controls,MiniMap,addEdge,Handle,Position} from 'https://esm.sh/@xyflow/react@12.9.2?deps=react@19.1.0,react-dom@19.1.0';import 'https://esm.sh/@xyflow/react@12.9.2/dist/style.css';const html=htm.bind(React.createElement);
const tabs=[['inicio','◈','Panel general'],['equipo','♙','Equipo y empresa'],['sector','▥','Inteligencia sectorial'],['proceso','⇄','Diagnóstico de procesos'],['tecnologia','✦','Solución tecnológica'],['impacto','↗','Impacto y ejecución'],['reporte','▤','Reporte técnico']];const technologies=[['Inteligencia artificial','Modelos, asistentes y automatización cognitiva'],['Ciencia de datos y analítica','Predicción, indicadores y patrones'],['Internet de las cosas (IoT)','Sensores, monitoreo y dispositivos conectados'],['Cloud computing','Servicios y procesamiento en la nube'],['Tecnología móvil','Aplicaciones y servicios móviles'],['Tecnología ubicua','Interacción contextual y conectividad'],['Tecnología cognitiva','Sistemas de reconocimiento y apoyo a decisiones'],['Blockchain','Trazabilidad y registros distribuidos'],['Realidad aumentada / virtual','Simulación y experiencias inmersivas'],['Smart Cities','Soluciones digitales para entornos urbanos']];const sources=[['OEC World','Comercio por producto y país','https://oec.world/'],['Banco Mundial','PIB, crecimiento, empleo e indicadores','https://data.worldbank.org/'],['UN Comtrade','Importaciones y exportaciones','https://comtradeplus.un.org/'],['INEGI','México: SCIAN, DENUE, estadísticas','https://www.inegi.org.mx/'],['DANE','Colombia: CIIU y estadísticas','https://www.dane.gov.co/']];const initial={flowCurrent:null,flowFuture:null,project:'',team:'',group:'',teacher:'',company:'',country:'México',region:'',website:'',size:'',employees:'',year:'',industry:'',classification:'',code:'',products:'',customers:'',competition:'',business:'',sectorNotes:'',sectorMetric:'',sectorValue:'',sectorYear:'',sectorUnit:'',sectorSource:'',sectorUrl:'',problem:'',processName:'',processOwner:'',current:['Recepción de solicitud','Revisión y procesamiento','Entrega de resultado'],future:['Captura digital','Validación automatizada','Entrega y seguimiento'],technology:'',techUse:'',techWhy:'',resources:'',privacy:'',benefits:'',kpis:'',cost:'',timeline:'',risks:'',development:'',conclusion:''};function FlowEditor({steps,graph,onGraphChange,title}){const start=()=>({nodes:steps.map((label,i)=>({id:'n'+i,position:{x:90+(i%2)*260,y:50+Math.floor(i/2)*140},data:{label},type:'default'})),edges:steps.slice(1).map((_,i)=>({id:'e'+i,source:'n'+i,target:'n'+(i+1),animated:false}))});const [local,setLocal]=React.useState(()=>graph?.nodes?graph:start());React.useEffect(()=>{if(graph?.nodes)setLocal(graph);},[graph]);const commit=v=>{setLocal(v);onGraphChange(v)};const onNodesChange=changes=>{let ns=[...local.nodes];for(const c of changes){if(c.type==='position'&&c.position)ns=ns.map(n=>n.id===c.id?{...n,position:c.position}:n);if(c.type==='remove')ns=ns.filter(n=>n.id!==c.id)}commit({...local,nodes:ns,edges:local.edges.filter(e=>ns.some(n=>n.id===e.source)&&ns.some(n=>n.id===e.target))})};const onEdgesChange=changes=>commit({...local,edges:local.edges.filter(e=>!changes.some(c=>c.id===e.id&&c.type==='remove'))});const addNode=type=>{const label=type==='decision'?'¿Se cumple la condición?':type==='input'?'Inicio / Fin':'Nueva actividad';commit({...local,nodes:[...local.nodes,{id:'n'+Date.now(),type:'default',position:{x:100+Math.random()*250,y:80+Math.random()*200},data:{label,kind:type}}]})};const rename=(id)=>{const n=local.nodes.find(x=>x.id===id);const value=window.prompt('Nombre de la actividad o decisión',n?.data?.label||'');if(value!==null)commit({...local,nodes:local.nodes.map(x=>x.id===id?{...x,data:{...x.data,label:value}}:x)})};return html`<div className="panel"><h3>${title}</h3><p className="muted">Arrastra los bloques; conecta los puntos de salida y entrada. Doble clic para editar el texto. Selecciona una conexión o bloque y presiona Supr para eliminarlo.</p><div className="flowToolbar"><button className="btn" onClick=${()=>addNode('activity')}>+ Actividad</button><button className="btn" onClick=${()=>addNode('decision')}>◇ Decisión</button><button className="btn" onClick=${()=>addNode('input')}>◯ Inicio / Fin</button><button className="btn" onClick=${()=>commit(start())}>Restablecer desde actividades</button></div><div className="flowCanvas"><${ReactFlow} nodes=${local.nodes.map(n=>({...n,style:{border:n.data.kind==='decision'?'2px solid #c49331':'1.5px solid #0d805b',borderRadius:n.data.kind==='decision'?4:12,background:n.data.kind==='decision'?'#fff4d9':'#e9f8f0',padding:12,minWidth:145,fontSize:13}}))} edges=${local.edges} onNodesChange=${onNodesChange} onEdgesChange=${onEdgesChange} onConnect=${c=>commit({...local,edges:addEdge({...c,animated:true},local.edges)})} onNodeDoubleClick=${(_,n)=>rename(n.id)} fitView=${true} deleteKeyCode=${['Backspace','Delete']}><${Background}/><${Controls}/><${MiniMap}/></${ReactFlow}></div><p className="muted">${local.nodes.length} actividades / decisiones · ${local.edges.length} conexiones. Los cambios se guardan automáticamente.</p></div>`}
function FlowPrint({graph,steps,title}){if(!graph?.nodes?.length)return html`<${Diagram} steps=${steps} title=${title}/>`;const nodes=graph.nodes;const minX=Math.min(...nodes.map(n=>n.position.x)),minY=Math.min(...nodes.map(n=>n.position.y));const positions=nodes.map(n=>({id:n.id,x:n.position.x-minX+35,y:n.position.y-minY+35,label:n.data.label,kind:n.data.kind}));const w=Math.max(600,...positions.map(n=>n.x+205)),h=Math.max(170,...positions.map(n=>n.y+100));return html`<div className="diagram"><svg viewBox=${`0 0 ${w} ${h}`} width="100%" role="img" aria-label=${title}>${graph.edges.map(e=>{const a=positions.find(n=>n.id===e.source),b=positions.find(n=>n.id===e.target);return a&&b?html`<g><path d=${`M${a.x+90} ${a.y+62} L${b.x+90} ${b.y}`} fill="none" stroke="#087958" stroke-width="2"/><circle cx=${b.x+90} cy=${b.y} r="4" fill="#087958"/></g>`:null})}${positions.map(n=>html`<g><rect x=${n.x} y=${n.y} width="180" height="62" rx=${n.kind==='decision'?3:11} fill=${n.kind==='decision'?'#fff1d3':'#e7f5ed'} stroke="#087958" stroke-width="2"/><text x=${n.x+90} y=${n.y+27} text-anchor="middle" font-size="11" fill="#153d30">${String(n.label).slice(0,26)}</text><text x=${n.x+90} y=${n.y+43} text-anchor="middle" font-size="11" fill="#153d30">${String(n.label).slice(26,52)}</text></g>`)}</svg></div>`}
function Diagram({steps,title}){let n=Math.max(steps.length,1),h=n*92+25;return html`<div className="diagram"><svg viewBox=${`0 0 600 ${h}`} width="600" role="img" aria-label=${title}>${(steps.length?steps:['Sin actividades definidas']).map((s,i)=>html`<g key=${i}><rect x="125" y=${i*92+9} width="350" height="56" rx="12" fill=${title.includes('propuesto')?'#e0f5e9':'#eaf2ef'} stroke="#0b7752" stroke-width="1.6"/><text x="300" y=${i*92+42} font-size="14" text-anchor="middle" fill="#164333">${s.length>46?s.slice(0,43)+'…':s}</text>${i<n-1&&html`<path d=${`M300 ${i*92+65} v25`} stroke="#0c865c" stroke-width="2"/><path d=${`M294 ${i*92+83} l6 7 6 -7`} fill="none" stroke="#0c865c" stroke-width="2"/>`}</g>`)}</svg></div>`}function Field({label,name,value,onChange,wide=false,textarea=false,options}){return html`<div className=${'field'+(wide?' wide':'')}><label>${label}</label>${options?html`<select value=${value||''} onChange=${e=>onChange(name,e.target.value)}>${options.map(o=>html`<option value=${o}>${o||'Selecciona…'}</option>`)}</select>`:textarea?html`<textarea value=${value||''} onChange=${e=>onChange(name,e.target.value)} placeholder="Escribe aquí…"/>`:html`<input value=${value||''} onChange=${e=>onChange(name,e.target.value)} placeholder="Escribe aquí…"/>`}</div>`}function App(){const[tab,setTab]=useState('inicio');const[d,setD]=useState(()=>{try{return{...initial,...JSON.parse(localStorage.getItem('innovatech2')||'{}')}}catch{return initial}});const[toast,setToast]=useState('');useEffect(()=>{localStorage.setItem('innovatech2',JSON.stringify(d))},[d]);const update=(k,v)=>setD(p=>({...p,[k]:v}));const required=['team','company','industry','classification','problem','processName','technology','techUse','benefits','development'];const done=required.filter(k=>String(d[k]||'').trim()).length;const progress=Math.round(done/required.length*100);const say=s=>{setToast(s);setTimeout(()=>setToast(''),4000)};const exportJson=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='innovatech-proyecto.json';a.click();URL.revokeObjectURL(a.href)};const importJson=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);setD({...initial,...x});say('Proyecto cargado correctamente')}catch{say('El archivo JSON no es válido')}};r.readAsText(f)};const stepEdit=(type,i,v)=>update(type,d[type].map((s,j)=>i===j?v:s));const stepRemove=(type,i)=>update(type,d[type].filter((_,j)=>j!==i));const stepsUI=(type,title)=>html`<div className="panel"><h3>${title}</h3><p className="muted">Escribe las actividades en el orden en que ocurren. El diagrama se actualiza al instante.</p><div className="steps">${d[type].map((s,i)=>html`<div className="step" key=${i}><span className="pill">${i+1}</span><input value=${s} onChange=${e=>stepEdit(type,i,e.target.value)} aria-label=${`Actividad ${i+1}`}/><button onClick=${()=>stepRemove(type,i)}>✕</button></div>`)}</div><p><button className="btn" onClick=${()=>update(type,[...d[type],'Nueva actividad'])}>+ Añadir actividad</button></p><${FlowEditor} steps=${d[type]} graph=${d[type==='current'?'flowCurrent':'flowFuture']} onGraphChange=${v=>update(type==='current'?'flowCurrent':'flowFuture',v)} title=${title}/></div>`;const F=(label,name,wide=false,textarea=false,options)=>html`<${Field} label=${label} name=${name} value=${d[name]} onChange=${update} wide=${wide} textarea=${textarea} options=${options}/>`;const reportText=(s)=>s?String(s):'No documentado';const reportRow=(label,value)=>html`<tr><th width="33%">${label}</th><td>${reportText(value)}</td></tr>`;const report=html`<article className="report"><div className="eyebrow">Universidad Autónoma de Baja California · Documento técnico</div><h2>${d.project||'Proyecto de innovación tecnológica'}</h2><p><strong>Asignatura:</strong> Tecnologías Digitales para la Innovación · Clave 39051</p><p><strong>Integrantes:</strong> ${reportText(d.team)}<br/><strong>Grupo:</strong> ${reportText(d.group)} · <strong>Docente:</strong> ${reportText(d.teacher)}</p><h3>1. Caracterización de la empresa</h3><table><tbody>${[['Empresa',d.company],['País y región',[d.country,d.region].filter(Boolean).join(', ')],['Sitio web',d.website],['Tamaño y colaboradores',[d.size,d.employees].filter(Boolean).join(' · ')],['Año de fundación',d.year],['Sector y actividad',d.industry],['Clasificación y código',[d.classification,d.code].filter(Boolean).join(' · ')],['Productos o servicios',d.products],['Clientes',d.customers],['Competencia',d.competition],['Modelo de negocio',d.business]].map(x=>reportRow(...x))}</tbody></table><h3>2. Investigación del sector económico</h3><p>${reportText(d.sectorNotes)}</p><table><tbody>${reportRow('Indicador',d.sectorMetric)}${reportRow('Valor y unidad',[d.sectorValue,d.sectorUnit].filter(Boolean).join(' '))}${reportRow('Año',d.sectorYear)}${reportRow('Fuente',d.sectorSource)}${reportRow('URL verificable',d.sectorUrl)}</tbody></table><p className="muted">Las estadísticas sectoriales no describen por sí mismas el desempeño particular de la empresa.</p><h3>3. Diagnóstico del proceso actual (AS-IS)</h3><p><strong>Proceso:</strong> ${reportText(d.processName)} · <strong>Responsable:</strong> ${reportText(d.processOwner)}</p><p><strong>Problema:</strong> ${reportText(d.problem)}</p><${FlowPrint} graph=${d.flowCurrent} steps=${d.current} title="Proceso actual"/><h3>4. Solución tecnológica y proceso propuesto (TO-BE)</h3><p><strong>Tecnología:</strong> ${reportText(d.technology)}</p><p><strong>Aplicación:</strong> ${reportText(d.techUse)}</p><p><strong>Justificación:</strong> ${reportText(d.techWhy)}</p><${FlowPrint} graph=${d.flowFuture} steps=${d.future} title="Proceso propuesto"/><h3>5. Impacto, factibilidad y desarrollo organizacional</h3><table><tbody>${[['Beneficios esperados',d.benefits],['Indicadores de evaluación',d.kpis],['Recursos requeridos',d.resources],['Costos estimados',d.cost],['Cronograma',d.timeline],['Riesgos y mitigación',d.risks],['Protección de datos y ética',d.privacy],['Contribución al desarrollo de la organización',d.development]].map(x=>reportRow(...x))}</tbody></table><h3>6. Conclusión</h3><p>${reportText(d.conclusion)}</p><h3>7. Fuentes y limitaciones</h3><p><strong>Fuente estadística consignada:</strong> ${reportText(d.sectorSource)}. ${reportText(d.sectorUrl)}</p><p>Los valores económicos deben comprobarse en la fuente y el periodo señalados. Los beneficios, costos e indicadores futuros son estimaciones de la propuesta, no resultados empíricos observados.</p><p className="muted">Generado con InnovaTech Lab 2.0 · ${new Date().toLocaleDateString('es-MX')}</p></article>`;return html`<div className="shell"><aside className="sidebar"><div className="brand"><div className="tag">UABC · FCA</div><h2>◈ InnovaTech</h2><small>LAB 2.0 · Innovation Studio</small></div><div className="nav">${tabs.map(([id,ic,label])=>html`<button className=${tab===id?'active':''} onClick=${()=>setTab(id)}><span>${ic}</span>${label}</button>`)}</div><div className="sidebarFoot">Proyecto guardado automáticamente en este navegador.<br/><strong>Sin registro ni cuentas.</strong><br/>Guarda una copia JSON si cambias de equipo.</div></aside><main className="main"><div className="top hideprint"><div><div className="eyebrow">Tecnologías Digitales para la Innovación</div><h1>${tabs.find(x=>x[0]===tab)?.[2]}</h1><div className="muted">Diseña una mejora tecnológica fundamentada para una organización.</div></div><div className="actions"><button className="btn" onClick=${exportJson}>↓ Guardar proyecto</button><label className="btn" style=${{cursor:'pointer'}}>↑ Recuperar<input type="file" accept=".json,application/json" hidden onChange=${importJson}/></label><button className="btn primary" onClick=${()=>{setTab('reporte');setTimeout(()=>window.print(),150)}}>↓ PDF</button></div></div>${toast&&html`<div className="notice hideprint">${toast}</div>`}${tab==='inicio'&&html`<div className="section"><div className="hero"><div><div style=${{fontSize:12,letterSpacing:2}}>INNOVACIÓN BASADA EN EVIDENCIA</div><h2>De un problema real a una solución digital.</h2><p>Caracteriza una empresa, investiga su entorno, diseña el antes y después de un proceso y presenta una propuesta de transformación tecnológica.</p><button className="btn" onClick=${()=>setTab('equipo')}>Comenzar proyecto →</button></div><div className="orb"></div></div><div className="stats"><div className="stat"><span>Avance del proyecto</span><strong>${progress}%</strong></div><div className="stat"><span>Campos clave completos</span><strong>${done}/${required.length}</strong></div><div className="stat"><span>Tecnología elegida</span><strong style=${{fontSize:17}}>${d.technology||'Pendiente'}</strong></div><div className="stat"><span>Actividades modeladas</span><strong>${d.current.length+d.future.length}</strong></div></div><div className="grid2"><div className="panel"><h3>Tu ruta de innovación</h3><p className="muted">Completa los módulos del menú y observa cómo se construye el documento técnico.</p><div className="progress"><div style=${{width:progress+'%'}}></div></div><span className="pill">${progress}% completado</span></div><div className="panel"><h3>Entrega académica</h3><p>Documento técnico con caracterización, investigación sectorial, diagramas AS-IS / TO-BE, selección tecnológica, impacto y fuentes.</p><button className="btn primary" onClick=${()=>setTab('reporte')}>Ver mi reporte →</button></div></div></div>`}${tab==='equipo'&&html`<div className="section"><div className="panel"><h3>01 · Identificación del proyecto</h3><div className="formgrid">${F('Nombre del proyecto','project',true)}${F('Integrantes y matrículas (uno por línea)','team',true,true)}${F('Grupo','group')}${F('Docente','teacher')}</div></div><div className="panel"><h3>02 · Brief de la organización</h3><p className="muted">Puedes utilizar una empresa real o un caso hipotético. Identifica qué información
